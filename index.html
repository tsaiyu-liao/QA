<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯合社課 課前QA</title>
<meta name="description" content="聯合社課課前問卷：測測看你的自我覺察到哪個程度">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style id="theme"></style>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: var(--width, 640px); margin: 0 auto; padding: 32px 16px 64px; }
  .loading { text-align: center; color: var(--muted); padding: 80px 0; }

  header { text-align: center; margin-bottom: 28px; }
  .enso { width: 64px; height: 64px; margin: 0 auto 12px; display: block; }
  .kicker { color: var(--muted); font-size: .9rem; letter-spacing: .2em; margin: 0; }
  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 700;
    font-size: clamp(1.5rem, 5vw, 2rem); margin: 4px 0 8px; letter-spacing: .05em;
  }
  .intro { color: var(--muted); margin: 0 auto; max-width: 30em; font-size: .95rem; }
  .hint {
    margin: 14px auto 0; max-width: 30em; font-size: .88rem;
    background: var(--accent-soft); color: var(--ink);
    border-radius: 10px; padding: 8px 14px;
  }

  form { display: grid; gap: 18px; }
  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 18px;
  }
  .card.invalid { border-color: var(--warn); }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; }
  .q-no {
    flex: none; font-family: "Noto Serif TC", serif; color: var(--accent);
    font-weight: 700; font-size: 1.05rem;
  }
  .q-title { font-weight: 500; margin: 0; font-size: 1.02rem; }
  .q-tag { display: inline-block; font-size: .75rem; color: var(--accent);
    background: var(--accent-soft); border-radius: 99px; padding: 0 10px; margin-bottom: 6px; }
  .req { color: var(--warn); margin-left: 2px; }

  input[type="text"], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    outline: none; appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px;
  }
  select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
  .optional { color: var(--muted); font-size: .85rem; font-weight: 400; margin-left: 4px; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .options { display: grid; gap: 8px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt label {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    background: var(--bg); transition: border-color .15s, background .15s;
  }
  .letter {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--accent); color: var(--accent);
    display: grid; place-items: center;
    font-family: "Noto Serif TC", serif; font-size: .9rem; line-height: 1;
    transition: background .15s, color .15s;
  }
  .opt input:checked + label .letter { background: var(--accent); color: var(--paper); }
  .opt-text { font-size: .95rem; line-height: 1.6; }
  .opt label:hover { border-color: var(--accent); }
  .opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
  .opt input:focus-visible + label { box-shadow: 0 0 0 3px var(--accent-soft); }

  .err { color: var(--warn); font-size: .85rem; margin: 8px 0 0; display: none; }
  .card.invalid .err { display: block; }

  button {
    font: inherit; font-weight: 700; letter-spacing: .2em; cursor: pointer;
    background: var(--accent); color: var(--paper); border: none;
    border-radius: 99px; padding: 14px 20px; width: 100%;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .status { text-align: center; font-size: .9rem; min-height: 1.5em; margin: 0; }
  .status.error { color: var(--warn); }

  /* ===== 測驗結果 ===== */
  .done { display: none; }
  .done.show { display: grid; gap: 18px; }
  .result-head { text-align: center; }
  .result-head .kicker { margin-top: 4px; }
  .result-emoji { font-size: 3rem; line-height: 1; margin: 4px 0 6px; }
  .result-head h2 { font-family: "Noto Serif TC", serif; margin: 0; font-size: 1.6rem; letter-spacing: .05em; }
  .score { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
  .meter { display: flex; gap: 4px; margin: 16px 0 4px; }
  .meter span { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
  .meter span.on { background: var(--accent); }
  .meter-labels { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  .lack {
    font-family: "Noto Serif TC", serif; font-weight: 700; color: var(--accent);
    font-size: 1.1rem; margin: 0 0 10px;
  }
  .result-body p { margin: 0 0 10px; }
  .result-body p:last-child { margin-bottom: 0; }
  .practice h3 { font-family: "Noto Serif TC", serif; font-size: 1.05rem; margin: 0 0 8px; }
  .practice p { margin: 0 0 10px; }
  .practice .tip {
    margin: 0; background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .93rem;
  }
  .breath ol { margin: 0; padding-left: 1.4em; }
  .breath li { margin-bottom: 4px; }
  .breath .note { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  .section-label { font-size: .8rem; color: var(--muted); letter-spacing: .15em; margin: 0 0 6px; }
  .thanks { text-align: center; color: var(--muted); font-size: .9rem; margin: 0; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="page"><p class="loading">載入中…</p></div>
  <footer id="footer"></footer>
</div>

<script src="config.js?v=4"></script>
<script src="default-config.js?v=4"></script>
<script>
const PREVIEW = new URLSearchParams(location.search).has("preview");
const LETTERS = "ABCDEFGHIJ";
const CN = "一二三四五六七八九十";
const cn = n => n <= 10 ? CN[n - 1] : n < 20 ? "十" + CN[n - 11] : String(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// **粗體** 和換行
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
const ENSO = `<svg class="enso" viewBox="0 0 64 64" aria-hidden="true">
  <path d="M50 14 A24 24 0 1 0 54 40" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg>`;

let C = null;   // 目前使用的設定

/* ===== 外觀 ===== */
function applyTheme(t) {
  const vars = p => `--bg:${p.bg};--paper:${p.paper};--ink:${p.ink};--muted:${p.muted};--line:${p.line};` +
    `--accent:${p.accent};--accent-soft:${p.accentSoft};--warn:${p.warn};`;
  document.getElementById("theme").textContent = `
    :root { ${vars(t.light)} --radius:${Number(t.radius) || 14}px; --width:${Number(t.width) || 640}px; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ${vars(t.dark)} } }
    :root[data-theme="dark"] { ${vars(t.dark)} }
    html { font-size: ${Number(t.fontSize) || 16}px; }`;
}

/* ===== 問卷 ===== */
function render(config) {
  C = withDefaults(config);
  applyTheme(C.theme);
  document.getElementById("footer").textContent = C.footer || "";
  const h = C.header;
  let no = 0;
  const qCard = (field, inner) => `<div class="card" data-field="${field}">${inner}</div>`;
  const head = (title, req = true) =>
    `<div class="q-head"><span class="q-no">${cn(++no)}</span><p class="q-title">${rich(title)}${req ? '<span class="req">*</span>' : '<span class="optional">（選填）</span>'}</p></div>`;

  let html = `
    <header>
      ${C.theme.showEnso ? ENSO : ""}
      ${h.kicker ? `<p class="kicker">${rich(h.kicker)}</p>` : ""}
      <h1>${rich(h.title)}</h1>
      ${h.intro ? `<p class="intro">${rich(h.intro)}</p>` : ""}
      ${h.hint ? `<p class="hint">${rich(h.hint)}</p>` : ""}
    </header>
    <form id="qa" novalidate>
      ${qCard("name", `${head(C.info.nameLabel)}
        <input type="text" id="name" autocomplete="name" maxlength="30" placeholder="${esc(C.info.namePlaceholder)}">
        <p class="err">請填寫${esc(C.info.nameLabel.replace(/^你的/, ""))}</p>`)}
      ${shownSelects().map((s, i) => qCard(`sel${i}`, `${head(s.label)}
        ${s.type === "text" ? `
        <input type="text" id="sel${i}" maxlength="30" placeholder="${esc(s.placeholder)}">
        <p class="err">請填寫${esc(s.label.replace(/^你的/, ""))}</p>` : `
        <select id="sel${i}">
          <option value="" selected disabled>請選擇</option>
          ${(s.options || []).map(o => `<option>${esc(o)}</option>`).join("")}
        </select>
        <p class="err">請選擇${esc(s.label.replace(/^你的/, ""))}</p>`}`)).join("")}`;

  C.questions.forEach(q => {
    html += `<div class="card" data-field="${q.id}" role="radiogroup" aria-labelledby="${q.id}-title">
      ${q.tag ? `<span class="q-tag">${esc(q.tag)}</span>` : ""}
      <div class="q-head"><span class="q-no">${cn(++no)}</span>
        <p class="q-title" id="${q.id}-title">${rich(q.title)}<span class="req">*</span></p></div>
      <div class="options">
        ${q.options.map((o, i) => `
          <div class="opt">
            <input type="radio" name="${q.id}" id="${q.id}-${i}" value="${i}">
            <label for="${q.id}-${i}">
              <span class="letter" aria-hidden="true">${LETTERS[i]}</span>
              <span class="opt-text">${rich(o.desc)}</span>
            </label>
          </div>`).join("")}
      </div>
      <p class="err">請選擇一個選項</p></div>`;
  });

  if (C.ask.show) {
    html += qCard("ask", `${C.ask.tag ? `<span class="q-tag">${esc(C.ask.tag)}</span>` : ""}
      ${head(C.ask.title, false)}
      <textarea id="ask" maxlength="500" placeholder="${esc(C.ask.placeholder)}"></textarea>`);
  }
  html += `
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button type="submit" id="submitBtn">${esc(C.submitText)}</button>
    </form>
    <section class="done" id="done" aria-live="polite"></section>`;

  document.getElementById("page").innerHTML = html;
  wireForm();
}

function wireForm() {
  const form = document.getElementById("qa");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("submitBtn");
  const clearInvalid = e => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("invalid");
    if (!form.querySelector(".card.invalid") && statusEl.classList.contains("error")) {
      statusEl.textContent = "";
      statusEl.className = "status";
    }
  };
  form.addEventListener("input", clearInvalid);
  form.addEventListener("change", clearInvalid);

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const { data, result } = collect();
    if (!validate(data)) {
      statusEl.textContent = "還有題目沒填喔";
      statusEl.className = "status error";
      return;
    }
    // 後台預覽：不送出，直接看結果
    if (PREVIEW) return showResult(data, result);
    if (SCRIPT_URL.startsWith("PASTE_")) {
      statusEl.textContent = "網站尚未設定後台網址（SCRIPT_URL），請聯絡幹部。";
      statusEl.className = "status error";
      return;
    }
    btn.disabled = true;
    btn.textContent = "送出中…";
    statusEl.textContent = "";
    statusEl.className = "status";
    try {
      // 用 text/plain 送 JSON，避免瀏覽器對 Apps Script 發出 CORS preflight
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "submit", ...data })
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || "unknown error");
      showResult(data, result);
    } catch (err) {
      console.error(err);
      statusEl.textContent = "送出失敗，請確認網路後再試一次。";
      statusEl.className = "status error";
      btn.disabled = false;
      btn.textContent = C.submitText;
    }
  });
}

const val = id => (document.getElementById(id)?.value || "").trim();
const shownSelects = () => (C.info.selects || []).filter(s => s.show);

function collect() {
  const form = document.getElementById("qa");
  const data = {
    name: val("name"),
    info: shownSelects().map((s, i) => ({ key: s.key, value: val(`sel${i}`) })),
    ask: val("ask"),
    answers: []
  };
  let total = 0;
  C.questions.forEach(q => {
    const el = form.querySelector(`input[name="${q.id}"]:checked`);
    const i = el ? Number(el.value) : -1;
    data.answers.push({ id: q.id, title: q.title, answer: i < 0 ? "" : `${LETTERS[i]} ${q.options[i].desc}` });
    if (i >= 0) total += Number(q.options[i].score) || 0;
  });
  const result = pickResult(total);
  data.score = total;
  data.type = result ? result.name : "";
  return { data, result };
}

// 分數剛好落在區間外時，找最接近的類型
function pickResult(total) {
  const dist = r => total < r.min ? r.min - total : total > r.max ? total - r.max : 0;
  return [...C.results].sort((a, b) => dist(a) - dist(b))[0];
}

function validate(data) {
  const form = document.getElementById("qa");
  let firstBad = null;
  const mark = (field, ok) => {
    const card = form.querySelector(`.card[data-field="${field}"]`);
    if (!card) return;
    card.classList.toggle("invalid", !ok);
    if (!ok && !firstBad) firstBad = card;
  };
  mark("name", !!data.name);
  data.info.forEach((f, i) => mark(`sel${i}`, !!f.value));
  data.answers.forEach(a => mark(a.id, !!a.answer));
  if (firstBad) firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
  return !firstBad;
}

/* ===== 測驗結果 ===== */
function showResult(data, r) {
  if (!r) return;
  document.getElementById("qa").style.display = "none";
  const T = C.resultText;
  const sorted = [...C.results].sort((a, b) => a.min - b.min);
  const level = sorted.indexOf(r);
  const done = document.getElementById("done");
  done.innerHTML = `
    <div class="card result-head">
      ${T.intro ? `<p class="kicker">${rich(T.intro.replace("{name}", data.name || "你"))}</p>` : ""}
      <div class="result-emoji" aria-hidden="true">${esc(r.emoji)}</div>
      <h2>${rich(r.name)}</h2>
      <p class="score">總分 ${data.score} 分（${r.min}–${r.max} 分）</p>
      ${T.showMeter ? `
        <div class="meter" aria-hidden="true">
          ${sorted.map((_, i) => `<span class="${i <= level ? "on" : ""}"></span>`).join("")}
        </div>
        <div class="meter-labels" aria-hidden="true"><span>${esc(T.meterLeft)}</span><span>${esc(T.meterRight)}</span></div>` : ""}
    </div>

    <div class="card result-body">
      <p class="section-label">${rich(T.lackLabel)}</p>
      <p class="lack">${rich(r.lack)}</p>
      ${(r.body || []).map(p => `<p>${rich(p)}</p>`).join("")}
    </div>

    <div class="card practice">
      <p class="section-label">${rich(T.practiceLabel)}</p>
      <h3>📝 ${rich(r.practiceTitle)}</h3>
      <p>${rich(r.practice)}</p>
      ${r.tip ? `<p class="tip">👉 ${rich(r.tip)}</p>` : ""}
    </div>

    ${C.breath.show ? `
    <div class="card breath">
      <p class="section-label">${rich(C.breath.title)}</p>
      <ol>${C.breath.steps.map(s => `<li>${rich(s)}</li>`).join("")}</ol>
      ${C.breath.note ? `<p class="note">${rich(C.breath.note)}</p>` : ""}
    </div>` : ""}

    ${T.thanks ? `<p class="thanks">${rich(T.thanks)}</p>` : ""}`;
  done.classList.add("show");
  if (!PREVIEW) window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ===== 載入設定 ===== */
async function loadConfig() {
  if (SCRIPT_URL.startsWith("PASTE_")) return DEFAULT_CONFIG;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(SCRIPT_URL + "?action=config", { signal: ctrl.signal });
    clearTimeout(timer);
    const out = await res.json();
    return out.ok && out.config ? out.config : DEFAULT_CONFIG;
  } catch (err) {
    console.error(err);
    return DEFAULT_CONFIG;
  }
}

if (PREVIEW) {
  // 後台 admin.html 會把編輯中的設定傳過來
  window.addEventListener("message", e => {
    const msg = e.data;
    if (!msg || msg.type !== "preview") return;
    const y = window.scrollY;
    render(msg.config);
    if (msg.view >= 0) {
      const r = [...C.results].sort((a, b) => a.min - b.min)[msg.view];
      if (r) showResult({ name: "小明", score: r.max }, r);
    }
    window.scrollTo(0, y);
  });
  render(DEFAULT_CONFIG);
  parent.postMessage({ type: "preview-ready" }, "*");
} else {
  loadConfig().then(render);
}
</script>
</body>
</html>
